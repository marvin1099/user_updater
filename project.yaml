# Administrator policy. The system installer copies this to
# /etc/user-updater/project.yaml. User requests are limited by this policy.
version: 1

schedule:
  days: [thu, sun]
  time: "03:00"
  response_minutes: 5
  user_tools_interval_hours: 24
  user_tools_response_minutes: 5
  check_interval_minutes: 1

interaction:
  # Controls rescheduling; the same delay choices are bounded by elapsed time.
  allow_deferral: true
  allow_system_deferral: true
  deferral_options_hours: [1, 4, 24]
  max_user_tools_deferral_hours: 48
  max_system_deferral_hours: 24

updates:
  run_system: true
  run_user_tools: true
  user_tools: [flatpak, pipx, pip, npm, cargo, gem]
  allow_custom_user_tools: true

retry:
  system:
    automatic_attempts: 2
    delay_minutes: 15
    user_manual_attempts: 0
  user_tools:
    automatic_attempts: 2
    delay_minutes: 15
    user_manual_attempts: 0

testing:
  system:
    fail_next: 0
    succeed_next: 0
  user_tools:
    fail_next: 0
    succeed_next: 0

window:
  # Let the desktop compositor or window rules place windows when disabled.
  automatic_positioning: true

system_scripts:
  # Only executable scripts in matching /etc/user-updater/scripts directories run.
  before:
    builder: false
    root: false
  after:
    builder: false
    root: false

security:
  builder_sudo_mode: package-manager
